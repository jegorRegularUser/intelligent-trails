name: Deploy to Beget VPS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create .env.local for build
        run: |
          cat > .env.local << 'EOF'
          ${{ secrets.ENV_FILE }}
          EOF

      - name: Install dependencies & Build
        run: |
          npm install
          npm run build

      - name: Deploy to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          # Приложение в корне репо; исключаем тяжёлое и приватное
          source: "."
          rm: true
          strip_components: 0
          overwrite: true
          exclude: ".git,node_modules,.next,legacy,.env.local"

      - name: Setup environment and restart app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /root/intelligent-trails
            
            # Создаём .env.local на сервере
            cat > .env.local << 'EOF'
            ${{ secrets.ENV_FILE }}
            EOF
            
            npm install --production
            pm2 restart intelligent-trails || pm2 start npm --name "intelligent-trails" -- start
            pm2 save