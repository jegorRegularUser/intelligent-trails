name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (без интеграционных, они ходят в живую сеть)
        run: npx vitest run --exclude "**/*.integration.test.*"

      - name: Build
        run: npm run build
        env:
          # Для сборки достаточно фиктивных значений — реальный .env.local ставится деплоем
          MONGODB_URI: mongodb://localhost:27017/ci-placeholder
          NEXTAUTH_SECRET: ci-placeholder-secret
          NEXT_PUBLIC_YANDEX_API_KEY: ci-placeholder
          YANDEX_CLIENT_ID: ci-placeholder
          YANDEX_CLIENT_SECRET: ci-placeholder
